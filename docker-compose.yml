version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: bbps-postgres
    restart: always
    environment:
      POSTGRES_DB: bbps_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bbps_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bbps-network
    ports:
      - "5432:5432"

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bbps-backend
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bbps_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bbps_secure_password_2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - bbps-network
    ports:
      - "8080:8080"

  # 3. React + Vite Frontend (with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bbps-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - bbps-network

volumes:
  postgres_data:

networks:
  bbps-network:
    driver: bridge
