services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: bbps-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: bbps-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # 2. React + Vite Frontend Static Site
  - type: web
    name: bbps-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://bbps-backend.onrender.com/api

databases:
  # 3. PostgreSQL Managed Database
  - name: bbps-db
    databaseName: bbps_db
    user: bbps_admin
    plan: free
    region: oregon
